<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Classical Search</title>
  <meta name="theme-color" content="#1b1b1f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Classical Search</h1><button id="logout-btn" class="link" type="button">ログアウト</button></header>
  <main>
    <section id="login" hidden>
      <p>Spotifyのクラシックを、楽章ではなく作品ごとに検索します。</p>
      <button id="login-btn" type="button">Spotifyでログイン</button>
      <p id="login-error" class="error"></p>
      <p class="muted small">Spotify Dashboardに登録するRedirect URI: <code id="redirect"></code></p>
    </section>
    <section id="app" hidden>
      <form id="form" role="search">
        <div class="row">
          <label>作曲家<input id="composer" list="composer-list" placeholder="例: Beethoven" autocomplete="off"></label>
          <label>作品名<input id="work" list="work-list" placeholder="例: Symphony No. 5" autocomplete="off"></label>
        </div>
        <label>演奏者 / 指揮者 / 楽団<input id="performer" placeholder="例: Karajan, Berliner Philharmoniker" autocomplete="off"></label>
        <p id="oo-status" class="note" aria-live="polite"></p>
        <datalist id="composer-list"></datalist>
        <datalist id="work-list"></datalist>
        <details class="filters">
          <summary>絞り込み（レーベル・年代）</summary>
          <div class="row">
            <label>レーベル<select id="label"><option value="">指定なし</option></select></label>
            <label>年代（発売年）<span class="years"><input id="yf" type="number" inputmode="numeric" min="1900" max="2100" placeholder="1950"> 〜 <input id="yt" type="number" inputmode="numeric" min="1900" max="2100" placeholder="1989"></span></label>
          </div>
        </details>
        <button type="submit">検索</button>
      </form>
      <div id="tabs" class="tabs" hidden>
        <button type="button" data-view="albums" class="tab on">アルバム</button>
        <button type="button" data-view="works" class="tab">作品ごと</button>
      </div>
      <div id="results"></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
